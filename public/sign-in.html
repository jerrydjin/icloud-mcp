<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · icloud-mcp</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f7;
      }
      @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
      main {
        max-width: 22rem; padding: 2rem; text-align: center;
        background: Canvas; border-radius: 14px;
        box-shadow: 0 1px 4px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
      }
      h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
      p { color: GrayText; margin: 0 0 1.5rem; }
      button {
        width: 100%; padding: .75rem 1rem; font-size: 1rem; font-weight: 600;
        color: #fff; background: #1f2328; border: 0; border-radius: 9px;
        cursor: pointer; display: inline-flex; gap: .5rem; align-items: center;
        justify-content: center;
      }
      button:hover { background: #33383f; }
      button:disabled { opacity: .6; cursor: default; }
      .err { color: #c00; font-size: .85rem; margin-top: 1rem; min-height: 1.2em; }
      svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
  </head>
  <body>
    <main>
      <h1>icloud-mcp</h1>
      <p>Sign in to authorize Claude to access your iCloud data.</p>
      <button id="gh">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        Sign in with GitHub
      </button>
      <div class="err" id="err"></div>
    </main>
    <script>
      // The authorize params Better Auth appended when it redirected here. We
      // pass them back as the callbackURL so, worst case, we re-enter the
      // authorize endpoint with a live session and the flow continues.
      const params = window.location.search.slice(1);
      const callbackURL =
        "/api/auth/mcp/authorize" + (params ? "?" + params : "");

      const btn = document.getElementById("gh");
      const err = document.getElementById("err");

      btn.addEventListener("click", async () => {
        btn.disabled = true;
        err.textContent = "";
        try {
          const res = await fetch("/api/auth/sign-in/social", {
            method: "POST",
            headers: { "content-type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ provider: "github", callbackURL }),
          });
          const data = await res.json();
          if (data && data.url) {
            window.location.href = data.url;
          } else {
            err.textContent =
              "Unexpected response: " + JSON.stringify(data);
            btn.disabled = false;
          }
        } catch (e) {
          err.textContent = String(e);
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
