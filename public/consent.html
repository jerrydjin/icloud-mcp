<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Authorize · icloud-mcp</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f7;
      }
      @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
      main {
        max-width: 24rem; padding: 2rem; text-align: center;
        background: Canvas; border-radius: 14px;
        box-shadow: 0 1px 4px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
      }
      h1 { font-size: 1.2rem; margin: 0 0 .5rem; }
      p { color: GrayText; margin: 0 0 1rem; }
      .meta {
        font-size: .85rem; text-align: left; background: rgba(127,127,127,.1);
        border-radius: 9px; padding: .75rem 1rem; margin: 0 0 1.5rem;
        word-break: break-all;
      }
      .meta b { color: CanvasText; }
      .row { display: flex; gap: .75rem; }
      button {
        flex: 1; padding: .75rem 1rem; font-size: 1rem; font-weight: 600;
        border-radius: 9px; cursor: pointer; border: 0;
      }
      button:disabled { opacity: .6; cursor: default; }
      #allow { color: #fff; background: #0a7d34; }
      #allow:hover { background: #0b8d3b; }
      #deny { background: rgba(127,127,127,.18); color: CanvasText; }
      .err { color: #c00; font-size: .85rem; margin-top: 1rem; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Authorize access</h1>
      <p>A client is requesting access to your icloud-mcp server.</p>
      <div class="meta">
        <div><b>Client:</b> <span id="client"></span></div>
        <div><b>Scopes:</b> <span id="scope"></span></div>
      </div>
      <div class="row">
        <button id="deny">Deny</button>
        <button id="allow">Allow</button>
      </div>
      <div class="err" id="err"></div>
    </main>
    <script>
      const q = new URLSearchParams(window.location.search);
      const consent_code = q.get("consent_code");
      document.getElementById("client").textContent =
        q.get("client_id") || "unknown";
      document.getElementById("scope").textContent =
        q.get("scope") || "openid";

      const allow = document.getElementById("allow");
      const deny = document.getElementById("deny");
      const err = document.getElementById("err");

      async function submit(accept) {
        allow.disabled = true;
        deny.disabled = true;
        err.textContent = "";
        try {
          const res = await fetch("/api/auth/oauth2/consent", {
            method: "POST",
            headers: { "content-type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ accept, consent_code }),
          });
          const data = await res.json();
          if (data && data.redirectURI) {
            window.location.href = data.redirectURI;
          } else {
            err.textContent = "Unexpected response: " + JSON.stringify(data);
            allow.disabled = false;
            deny.disabled = false;
          }
        } catch (e) {
          err.textContent = String(e);
          allow.disabled = false;
          deny.disabled = false;
        }
      }

      allow.addEventListener("click", () => submit(true));
      deny.addEventListener("click", () => submit(false));
    </script>
  </body>
</html>
